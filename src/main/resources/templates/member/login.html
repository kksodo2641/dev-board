<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/member.css}">
</head>

<body>
<div class="container">
    <div class="signup-card">
        <div class="header">
            <h1>Dev Board</h1>
            <p>로그인</p>
        </div>

        <form th:object="${loginRequest}" th:action="@{/members/login}" method="post">
            <!-- 리다이렉트 URL (히든 필드) -->
            <input type="hidden" name="redirectURL" th:value="${redirectURL}">

            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" th:field="*{email}" placeholder="example@email.com">
                <div th:errors="*{email}" class="error"></div>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" placeholder="비밀번호 입력">
                <div th:errors="*{password}" class="error"></div>
            </div>

            <!-- 로그인 실패 메시지 -->
            <div th:if="${#fields.hasGlobalErrors()}" class="error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"/>
            </div>

            <button type="submit" class="signup-btn">로그인</button>

            <div class="login-footer">
                <a th:href="@{/members/signup}">아직 회원이 아니신가요? 회원가입</a>
            </div>
        </form>
    </div>
</div> <!--/container-->

</body>
</html>
