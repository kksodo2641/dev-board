<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <title>게시글 작성</title>
</head>

<body>
<div class="container">

    <div class="board-card">
        <div class="header">
            <h1>Dev Board</h1>
            <p>게시글 작성</p>
        </div>

        <form th:object="${writeBoardRequest}" th:action method="post">

            <div class="form-group">
                <label for="category">카테고리</label>

                <select id="category" th:field="*{category}">
                    <option value="">카테고리 선택</option>

                    <option th:each="c : ${categories}"
                            th:value="${c}" th:text="${c.description}">
                    </option>
                </select>

                <div th:errors="*{category}" class="error">카테고리 오류 메시지</div>
            </div>

            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" th:field="*{title}" placeholder="제목을 입력하세요">
                <div th:errors="*{title}" class="error">제목 오류 메시지</div>
            </div>

            <div class="form-group">
                <label for="content">내용</label>
                <textarea id="content" th:field="*{content}" placeholder="내용을 입력하세요"></textarea>
                <div th:errors="*{content}" class="error">내용 오류 메시지</div>
            </div>

            <div th:if="${#fields.hasGlobalErrors()}" class="error">
                <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">글로벌 오류 메시지</p>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">작성하기</button>
                <a th:href="@{/}" class="btn btn-secondary">취소</a>
            </div>
        </form>
    </div>
</div> <!--/container-->
</body>
</html>
