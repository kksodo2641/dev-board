<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
    <title>게시글 목록</title>
</head>

<body>
<div class="container">
    <div class="board-list-container">

        <div class="header">
            <h1>Dev Board</h1>
            <p>게시글 목록</p>
        </div>

        <table class="board-list">
            <thead>
            <tr>
                <th>번호</th>
                <th>카테고리</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
            </tr>
            </thead>

            <tbody>

            <tr th:if="${#lists.isEmpty(boardList)}">
                <td colspan="5" class="empty-message">
                    게시글이 없습니다.
                </td>
            </tr>

            <tr th:each="board : ${boardList}">
                <td th:text="${board.boardId}">1</td>

                <td th:text="${board.category.description}">
                    자유게시판
                </td>

                <td class="title-column">
                    <a th:href="@{|/boards/${board.boardId}|}"
                       th:text="${board.title}"
                       th:classappend="${board.deleted} ? 'deleted-board' : ''">
                        게시글 제목
                    </a>
                </td>

                <td th:text="${board.writerNickname}">
                    작성자
                </td>

                <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd')}">
                    2026-06-17
                </td>
            </tr>

            </tbody>
        </table>

        <div class="button-group">
            <a th:href="@{/boards/write}" class="btn btn-primary">
                글쓰기
            </a>

            <a th:href="@{/}" class="btn btn-secondary">
                홈으로
            </a>
        </div>

    </div>

</div>
</body>
</html>
