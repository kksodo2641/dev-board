<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>

<body>

<div class="container">
    <div class="detail-container">
        <!-- 게시글 -->
        <div class="board-card">
            <div class="header">
                <h1>Dev Board</h1>
                <p>게시글 상세</p>
            </div>

            <div class="board-title">
                <h2 th:text="${board.title}">제목</h2>
            </div>

            <div class="board-meta">
                <div>
                    <strong>작성자</strong>
                    <span th:text="${board.writerNickname}">작성자</span>
                </div>
                <div>
                    <strong>카테고리</strong>
                    <span th:text="${board.category.description}">카테고리</span>
                </div>
                <div>
                    <strong>작성일시</strong>
                    <span th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">작성일시</span>
                </div>
                <div>
                    <strong>조회수</strong>
                    <span th:text="${board.viewCount}">0</span>
                </div>
            </div>

            <div class="board-content">
                <p th:text="${board.content}">게시글 내용</p>
            </div>

            <div th:if="${canEdit || canDelete}" class="button-group">
                <a th:if="${canEdit}"
                   th:href="@{|/boards/${board.boardId}/edit|}" class="btn btn-edit">게시글 수정</a>

                <form th:if="${canDelete}"
                      th:action="@{|/boards/${board.boardId}/delete|}" method="post">

                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('정말 삭제하시겠습니까?');">게시글 삭제
                    </button>
                </form>
            </div>
        </div>

        <!-- 댓글 -->
        <div class="comment-card">
            <div class="comment-header">
                <h2>💬 댓글</h2>
            </div>

            <div class="comment-write">
                <form th:object="${writeCommentRequest}"
                      th:action="@{|/boards/${board.boardId}/comments/write|}" method="post">

                    <input type="hidden" th:field="*{parentId}">

                    <div class="form-group">
                        <p class="comment-description">자유롭게 의견을 남겨보세요.</p>

                        <textarea th:field="*{content}"
                                  rows="4" maxlength="2000"
                                  placeholder="댓글을 입력해주세요."
                                  th:disabled="${!isLoginMember}">
                        </textarea>

                        <div th:if="${#fields.hasErrors('content')}"
                             th:errors="*{content}" class="error">내용 에러 메시지</div>
                    </div>

                    <div class="comment-write-footer">
                        <span class="comment-guide">
                            <span th:if="${isLoginMember}">최대 2,000자</span>
                            <span th:unless="${isLoginMember}">댓글을 작성하려면 로그인해주세요.</span>
                        </span>

                        <button th:if="${isLoginMember}"
                                type="submit" class="btn btn-primary">댓글 작성</button>

                        <a th:unless="${isLoginMember}" class="btn btn-primary"
                           th:href="@{|/members/login?redirectURL=/boards/${board.boardId}|}">로그인</a>
                    </div>
                </form>
            </div>

            <!--
                댓글 조회 구현 예정

                <div class="comment-list">
                    ...
                </div>
            -->
        </div>

        <div class="detail-footer">
            <div class="button-group">
                <a th:href="@{/boards}" class="btn btn-primary">목록으로</a>
                <a th:href="@{/}" class="btn btn-secondary">홈으로</a>
            </div>
        </div>

    </div> <!--/detail-container-->
</div> <!--/container-->

</body>
</html>
