<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ko"
      th:fragment="errorPage(statusCode, errorTitle, errorMessage)">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <title th:text="|${statusCode} - ${errorTitle}|">오류</title>
</head>

<body>
<div class="container">
    <main class="error-card">
        <p class="error-status" th:text="${statusCode}">404</p>

        <h1 class="error-title" th:text="${errorTitle}">
            페이지를 찾을 수 없습니다
        </h1>

        <p class="error-description" th:text="${errorMessage}">
            요청한 페이지를 확인해 주세요.
        </p>

        <div class="button-group">
            <a th:href="@{/}" class="btn btn-primary">홈으로</a>
        </div>
    </main>
</div>
</body>
</html>
